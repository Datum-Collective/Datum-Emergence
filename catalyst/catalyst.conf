# Catalyst 4.1.1 TOML configuration template. build.sh generates absolute paths.
digests = ["sha512"]
options = ["autoresume", "bindist", "pkgcache", "seedcache"]
sharedir = "/usr/share/catalyst"
storedir = "@WORKDIR@/catalyst"
distdir = "@WORKDIR@/distfiles"
port_logdir = "@WORKDIR@/logs"
jobs = 4
