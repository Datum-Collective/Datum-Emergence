# Catalyst 4.1.1 TOML configuration template. build.sh generates absolute paths.
digests = ["sha512"]
# No seedcache: our stage sources are files (stage3 tarball, stage tarball),
# so seedcache would only retain unpacked chroots in tmp/ (gigabytes) with no
# reuse benefit. pkgcache stays: binpkgs make rebuilds incremental.
options = ["autoresume", "bindist", "pkgcache"]
sharedir = "/usr/share/catalyst"
storedir = "@WORKDIR@/catalyst"
distdir = "@WORKDIR@/distfiles"
port_logdir = "@WORKDIR@/logs"
jobs = "@JOBS@"
