# Datum Emergence: generic Hyprland baseline.
$terminal = kitty
$launcher = wofi --show drun

monitor = ,preferred,auto,1
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland

exec-once = hyprpaper
exec-once = waybar
exec-once = dunst
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

general {
  layout = dwindle
  gaps_in = 3
  gaps_out = 0
  border_size = 2
  resize_on_border = true
  col.active_border = rgba(d0d0d0ff) rgba(f5f5f5ff) 0deg
  col.inactive_border = rgba(444444cc)
}
decoration {
  rounding = 2
  active_opacity = 1.0
  inactive_opacity = 1.0
  shadow { enabled = true; range = 6; render_power = 3; color = rgba(00000066) }
}
animations { enabled = true }
input {
  kb_layout = us
  follow_mouse = 1
  touchpad { tap-to-click = true; disable_while_typing = true; clickfinger_behavior = true }
}
dwindle { preserve_split = true }

$mainMod = SUPER
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $launcher
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, thunar
bind = $mainMod, P, exec, datum-power
bind = $mainMod, Print, exec, datum-screenshot
bind = $mainMod SHIFT, R, exec, datum-record-screen
bind = $mainMod, F, fullscreen,
bind = $mainMod, Space, togglefloating,
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
