wallpaper {
    # Empty monitor applies this wallpaper as the fallback on every output.
    monitor =
    # Emergence adaptation: the rice points at $HOME/.config/hypr/wallpapers/;
    # the distribution installs the same file under /usr/share.
    path = /usr/share/backgrounds/datum-emergence/wallpaper.png
    fit_mode = cover
}

ipc = true
splash = false
